<title>ColorShred</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ColorShred">
<meta name="theme-color" content="#16172a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one-screen app. Welcome menu -> Levels / Colors / Unstoppable; Play = stats, board in a shredder frame, power-ups, controls. */
:root {
  --ink: #16172a;        /* page */
  --glow: #23244a;       /* page top glow (tinted by equipped color) */
  --steel: #2b2d4a;      /* panels */
  --steel-hi: #3a3d63;
  --frame-hi: #3a3d63;   /* board frame (tinted by equipped color) */
  --frame-lo: #2b2d4a;
  --pit: #1d1e34;        /* board field */
  --line: #ffffff10;
  --text: #f3f1ff;
  --muted: #a3a2c9;
  --accent: #ffc93c;     /* sun yellow: UI emphasis, coins */
  --danger: #ff6b6b;
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--glow) 0%, var(--ink) 60%) fixed, var(--ink);
  color: var(--text); font-family: var(--body); font-weight: 800;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: default; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.coins { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px 7px 8px; border-radius: 999px; background: #00000040;
  font-family: var(--display); font-size: 18px; color: var(--accent); font-variant-numeric: tabular-nums; flex: none; }
.coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc93c 45%, #d99a12);
  box-shadow: inset 0 -2px 0 #0003; display: inline-block; flex: none; }
.coins.bump { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.18); } }

/* ---------- Welcome ---------- */
#welcome { align-items: center; justify-content: center; gap: 14px; overflow: hidden; }
.wtop { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 2; }
.floaters { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.floater { position: absolute; top: -80px; border-radius: 22%; opacity: .22; animation: fall linear infinite; }
@keyframes fall { to { transform: translateY(120vh) rotate(200deg); } }
.brand { text-align: center; position: relative; }
.brand h1 { font-family: var(--display); font-weight: 400; font-size: clamp(46px, 15vw, 76px); letter-spacing: .5px; margin: 0; line-height: 1; }
.brand h1 span { display: inline-block; }
.brand p { margin: 10px 0 0; color: var(--muted); font-size: 16px; }
.menu { display: grid; gap: 12px; width: min(340px, 100%); position: relative; margin-top: 18px; }
.mbtn { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-radius: 20px;
  background: var(--steel); box-shadow: inset 0 -5px 0 #0004, inset 0 2px 0 #ffffff14; text-align: left; }
.mbtn b { font-family: var(--display); font-weight: 400; font-size: 26px; display: block; line-height: 1.05; }
.mbtn small { color: var(--muted); font-size: 13px; }
.mbtn.play { background: var(--accent); color: #241a00; }
.mbtn.play small { color: #5c4300; }
.mbtn.unst { background: linear-gradient(120deg, #e9509f, #9a5be8 55%, #4f63e8); }
.mbtn.unst small { color: #ffffffcc; }
.mbtn svg { width: 30px; height: 30px; flex: none; }
.install { position: relative; width: min(340px, 100%); margin-top: 6px; padding: 12px 14px; border-radius: 16px; background: #ffffff12;
  font-size: 14px; line-height: 1.4; font-weight: 700; color: var(--muted); display: flex; gap: 10px; align-items: flex-start; }
.install b { color: var(--text); }
.install svg { width: 22px; height: 22px; flex: none; color: var(--accent); margin-top: 1px; }
.install button { margin-left: auto; padding: 0 4px; font-size: 20px; line-height: 1; color: var(--muted); }
.mrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sbtn { padding: 12px 4px; border-radius: 16px; background: var(--steel); box-shadow: inset 0 -4px 0 #0004; font-size: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; }
.sbtn svg { width: 24px; height: 24px; }

/* ---------- Levels / Colors ---------- */
.head { display: flex; align-items: center; gap: 10px; padding-top: 8px; padding-bottom: 6px; }
.head h2 { flex: 1; margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; text-align: center; }
.list { max-width: 520px; width: 100%; margin: 0 auto; padding-bottom: 20px; }
.banner { margin: 10px 0 4px; padding: 14px 16px; border-radius: 18px; background: linear-gradient(120deg, #ffc93c33, #e9509f33); text-align: center; }
.banner b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--accent); }
.tier { margin: 18px 0 0; }
.tier-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.tier-head h3 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: .3px; }
.tier-head small { color: var(--muted); font-size: 13px; text-align: right; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.lv { aspect-ratio: 1; border-radius: 16px; background: var(--steel); box-shadow: inset 0 -4px 0 #0003, inset 0 1px 0 #ffffff14;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 19px; position: relative; }
.lv .st { font-size: 11px; letter-spacing: 1px; color: var(--accent); min-height: 13px; }
.lv.done { background: var(--steel-hi); }
.lv.locked { opacity: .32; }
.lv.locked svg { width: 18px; height: 18px; }
.lv.next { box-shadow: inset 0 -4px 0 #0003, 0 0 0 3px var(--tc); }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; margin-top: 12px; }
.sw { border-radius: 16px; padding: 6px 4px 8px; background: var(--steel); display: flex; flex-direction: column; align-items: center; gap: 5px;
  font-size: 10px; line-height: 1.15; text-align: center; color: var(--muted); min-width: 0; }
.sw i { width: 40px; height: 40px; border-radius: 12px; display: block; box-shadow: inset 0 -5px 0 #0003, inset 0 2px 0 #ffffff40; }
.sw.locked i { background: repeating-linear-gradient(45deg, #3a3c5e 0 5px, #303252 5px 10px) !important; box-shadow: none; }
.sw.on { box-shadow: 0 0 0 3px var(--accent); color: var(--text); }
.note { color: var(--muted); font-size: 14px; text-align: center; margin: 4px 0 0; font-weight: 600; }

/* ---------- Play ---------- */
#play { gap: 7px; }
.topbar { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 14px; background: var(--steel); display: grid; place-items: center; flex: none;
  box-shadow: inset 0 -3px 0 #0004; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn:active { transform: translateY(1px); }
.title { flex: 1; text-align: center; min-width: 0; }
.title .lvname { font-family: var(--display); font-size: 28px; line-height: 1; }
.chip { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 999px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #16172a; background: var(--tc); }
.stats { display: flex; justify-content: center; gap: 10px; }
.stat { background: #ffffff0b; border-radius: 14px; padding: 5px 8px; text-align: center; flex: 1; max-width: 120px; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.stat.warn b { color: var(--danger); }
#stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
.powers { min-height: 56px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 420px; width: 100%; margin: 0 auto; }
.pu { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px 5px; border-radius: 14px;
  background: linear-gradient(180deg, #ffffff14, #ffffff08); box-shadow: inset 0 -3px 0 #0004; font-size: 11px; }
.pu svg { width: 22px; height: 22px; }
.pu .cost { display: inline-flex; align-items: center; gap: 3px; color: var(--accent); font-size: 11px; }
.pu .cost .coin { width: 11px; height: 11px; }
.pu .left { position: absolute; top: -5px; right: -3px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #241a00;
  font-size: 11px; display: grid; place-items: center; padding: 0 4px; }
.pu:disabled { opacity: .38; }
.pu.armed { background: var(--accent); color: #241a00; }
.pu.armed .cost { color: #241a00; }
.controls { display: flex; justify-content: center; gap: 12px; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 72px; padding: 7px 0; border-radius: 16px; background: var(--steel);
  font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); box-shadow: inset 0 -3px 0 #0004; }
.ctl svg { width: 22px; height: 22px; color: var(--text); }
.ctl:disabled { opacity: .4; }
.gen { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 15px; }
.spinner { width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 12px; background: var(--accent); animation: spin 1s ease-in-out infinite; }
@keyframes spin { 50% { transform: rotate(180deg) scale(.7); border-radius: 50%; background: #e9509f; } 100% { transform: rotate(360deg); } }
.flash { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-family: var(--display); font-size: 44px; color: var(--accent);
  text-shadow: 0 4px 0 #0006; pointer-events: none; z-index: 12; animation: flash 1.1s ease-out forwards; white-space: nowrap; }
@keyframes flash { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 100% { opacity: 0; transform: translate(-50%, -90%) scale(1); } }

/* board */
.frame { position: relative; border-radius: calc(var(--cs) * .32); background: linear-gradient(180deg, var(--frame-hi), var(--frame-lo));
  box-shadow: 0 14px 30px #0007, inset 0 2px 0 #ffffff18, inset 0 -5px 0 #0004; touch-action: none; }
.field { position: absolute; overflow: hidden; border-radius: calc(var(--cs) * .12); background-color: var(--pit);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: var(--cs) var(--cs); box-shadow: inset 0 3px 8px #0008; }
.field.arming { box-shadow: inset 0 3px 8px #0008, 0 0 0 3px var(--accent); }
.wall { position: absolute; border-radius: calc(var(--cs) * .14);
  background: repeating-linear-gradient(45deg, #3a3c5e 0 6px, #303252 6px 12px); box-shadow: inset 0 -3px 0 #0005, inset 0 2px 0 #ffffff12; }
.gate { position: absolute; border-radius: calc(var(--cs) * .16); overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 2px;
  background: var(--gc); box-shadow: inset 0 0 0 2px #0003; }
.gate::before { content: ""; position: absolute; inset: 0; opacity: .55; }
.gate.v::before { background: repeating-linear-gradient(0deg, transparent 0 5px, #0005 5px 7px); }
.gate.h::before { background: repeating-linear-gradient(90deg, transparent 0 5px, #0005 5px 7px); }
.gate.v { flex-direction: column; }
.gate svg { position: relative; width: calc(var(--cs) * .3); height: calc(var(--cs) * .3); flex: none; color: #fff; filter: drop-shadow(0 1px 0 #0006); }
.gate svg.gsym { fill: #fff; width: calc(var(--cs) * .34); height: calc(var(--cs) * .34); }
.gate.pulse { animation: gpulse .5s ease-out; }
@keyframes gpulse { 50% { filter: brightness(1.6); transform: scale(1.08); } }
.block { position: absolute; left: 0; top: 0; will-change: transform; transition: transform 70ms linear; }
.block.grab { z-index: 5; filter: brightness(1.12) drop-shadow(0 6px 8px #0008); }
.block.exiting { transition: transform 300ms cubic-bezier(.5,0,.9,.6); z-index: 4; }
.block.blasting { transition: transform 260ms ease-in, opacity 260ms ease-in; opacity: 0; z-index: 4; }
.cell { position: absolute; background: var(--bc); }
.sym { position: absolute; pointer-events: none; fill: var(--bd); filter: drop-shadow(0 1.5px 0 #ffffff59); overflow: visible; }
.chev { position: absolute; pointer-events: none; overflow: visible; fill: #fff; filter: drop-shadow(0 1px 1px #0008); }
.ice { position: absolute; pointer-events: none; background: linear-gradient(135deg, #e8f6ff99, #bfe3ff55 50%, #e8f6ff99);
  box-shadow: inset 0 0 0 2px #ffffffaa; display: grid; place-items: center;
  font-family: var(--display); color: #2b5b86; font-size: calc(var(--cs) * .55); transition: opacity .4s; }
.block.shake { animation: shake .3s; }
@keyframes shake { 25% { translate: -4px 0; } 75% { translate: 4px 0; } }
.ghost { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3; }
.ghost .cell { background: transparent; box-shadow: none !important; outline: 3px dashed #fff; outline-offset: -4px; }
.block.hint { animation: hint 1s ease-in-out infinite; }
@keyframes hint { 50% { filter: brightness(1.5) drop-shadow(0 0 10px #fff); } }
.shred { position: absolute; pointer-events: none; border-radius: 2px; z-index: 6; }

/* overlays */
.overlay { position: absolute; inset: 0; background: #0b0c18cc; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: flex; z-index: 20; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.overlay > .card { margin: auto; }
@media (max-height: 760px) {
  .card { padding: 18px 18px 16px; } .card h3 { font-size: 30px; } .card p { margin-bottom: 10px; }
  .btn { padding: 11px; margin-top: 8px; font-size: 17px; }
  .slot { width: 50px; height: 50px; } .slot.mid { width: 62px; height: 62px; }
  .unlock { padding: 8px 10px; } .unlock i { width: 34px; height: 34px; } .reward { margin-bottom: 6px; }
}
.card { box-sizing: border-box; min-width: 0; width: min(360px, 100%); background: var(--steel); border-radius: 26px; padding: 24px 22px 20px; text-align: center;
  box-shadow: 0 20px 50px #0009, inset 0 2px 0 #ffffff18; }
.card h3 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0 0 6px; }
.card p { color: var(--muted); margin: 0 0 14px; font-size: 15px; line-height: 1.45; font-weight: 700; }
.stars { display: flex; justify-content: center; align-items: flex-end; gap: 8px; margin: 0 0 10px; }
.slot { position: relative; width: 62px; height: 62px; }
.slot.mid { width: 78px; height: 78px; margin-bottom: 8px; }
.slot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.slot .empty { fill: #00000040; stroke: #ffffff26; stroke-width: 1.2; transition: fill .3s; }
.slot .full { fill: var(--accent); stroke: #fff6c8; stroke-width: .8; opacity: 0; }
.slot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid #ffe27a; opacity: 0; pointer-events: none; }
.slot.on .full { animation: starDrop .6s cubic-bezier(.3, 1.45, .5, 1) var(--d) forwards, starGlow 1.8s ease-in-out calc(var(--d) + .6s) infinite; }
.slot.on .empty { animation: slotLit .3s ease-out calc(var(--d) + .4s) forwards; }
.slot.on::after { animation: ring .6s ease-out calc(var(--d) + .4s); }
@keyframes starDrop { 0% { opacity: 0; transform: translateY(-150px) scale(1.9) rotate(-50deg); } 65% { opacity: 1; transform: translateY(5px) scale(.9) rotate(8deg); } 100% { opacity: 1; transform: none; } }
@keyframes starGlow { 0%, 100% { filter: drop-shadow(0 0 5px #ffc93c99); } 50% { filter: drop-shadow(0 0 16px #ffe27a) brightness(1.18); } }
@keyframes slotLit { to { fill: #ffc93c55; stroke: #ffe27a; } }
@keyframes ring { 0% { opacity: .9; transform: scale(.5); } 100% { opacity: 0; transform: scale(1.35); } }
/* 3 stars: the stars keep shining (stronger glow, light sweep, rays behind the middle star, twinkling sparkles) */
.stars { position: relative; }
.slot svg { z-index: 1; }
.stars.perfect .slot.on .full { animation: starDrop .6s cubic-bezier(.3, 1.45, .5, 1) var(--d) forwards, starGlowBig 1.4s ease-in-out calc(var(--d) + .6s) infinite; }
@keyframes starGlowBig { 0%, 100% { filter: drop-shadow(0 0 8px #ffc93caa); } 50% { filter: drop-shadow(0 0 22px #ffe27a) brightness(1.3); } }
.sweep { opacity: 0; animation: sweep 2.8s ease-in-out var(--sw) infinite; }
@keyframes sweep { 0% { opacity: 1; transform: translateX(-70px); } 35% { opacity: 1; transform: translateX(150px); } 36%, 100% { opacity: 0; transform: translateX(150px); } }
.stars.perfect .slot.mid::before { content: ""; position: absolute; inset: -46px; border-radius: 50%; z-index: 0; opacity: 0;
  background: repeating-conic-gradient(from 0deg, #ffe27a55 0deg 10deg, transparent 10deg 30deg);
  -webkit-mask: radial-gradient(circle, #000 25%, transparent 68%); mask: radial-gradient(circle, #000 25%, transparent 68%);
  animation: raysIn .8s ease-out 1.5s forwards, spinRays 9s linear 1.5s infinite; }
@keyframes raysIn { to { opacity: 1; } }
@keyframes spinRays { to { transform: rotate(360deg); } }
.sparkle { position: absolute; width: 16px; height: 16px; fill: #fff6c8; z-index: 2; pointer-events: none; opacity: 0;
  filter: drop-shadow(0 0 4px #ffe27a); animation: twinkle 1.6s ease-in-out var(--tw) infinite; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0deg); } 50% { opacity: 1; transform: scale(1) rotate(45deg); } }
.goal { font-size: 13px; color: var(--muted); margin: 8px 0 0; font-weight: 700; }
.reward { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 26px; color: var(--accent); margin-bottom: 10px; }
.reward .coin { width: 26px; height: 26px; }
.unlock { display: flex; align-items: center; gap: 12px; text-align: left; background: #00000030; border-radius: 16px; padding: 10px 12px; margin-bottom: 6px; }
.unlock i { width: 42px; height: 42px; border-radius: 12px; flex: none; box-shadow: inset 0 -5px 0 #0003, inset 0 2px 0 #ffffff40; }
.unlock div { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
.unlock b { display: block; color: var(--text); font-size: 16px; }
.unlock button { padding: 8px 12px; border-radius: 12px; background: #ffffff1a; font-size: 13px; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 16px; font-size: 18px; background: var(--accent); color: #241a00;
  box-shadow: inset 0 -4px 0 #0003; margin-top: 10px; }
.btn.alt { background: #ffffff14; color: var(--text); }
.btn.danger { background: #ff6b6b22; color: var(--danger); }
.btn:disabled { opacity: .4; }
.picks { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 6px 0 4px; }
.picks button { width: 54px; height: 54px; border-radius: 16px; box-shadow: inset 0 -5px 0 #0003, inset 0 2px 0 #ffffff40; display: grid; place-items: center; }
.picks svg { width: 28px; height: 28px; fill: #00000055; }
.rules { text-align: left; display: grid; gap: 10px; margin: 6px 0 14px; color: var(--text); font-size: 15px; line-height: 1.4; font-weight: 600; }
.rules div { display: flex; gap: 10px; }
.rules b { color: var(--accent); font-family: var(--display); font-weight: 400; font-size: 18px; min-width: 18px; }
textarea { width: 100%; box-sizing: border-box; min-height: 90px; border-radius: 12px; border: 0; padding: 10px; background: #0005; color: var(--text);
  font: 600 12px/1.4 ui-monospace, Menlo, monospace; resize: vertical; -webkit-user-select: text; user-select: text; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 .btn { margin-top: 10px; }
.toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: #000d; padding: 10px 16px; border-radius: 12px;
  font-size: 14px; z-index: 15; max-width: 88%; text-align: center; transition: opacity .3s; pointer-events: none; }
@media (prefers-reduced-motion: reduce) {
  .block, .block.exiting, .block.blasting { transition-duration: 1ms; }
  .block.hint, .gate.pulse, .floater, .flash, .spinner, .slot::after, .slot.on .empty { animation: none; }
  .slot.on .full, .stars.perfect .slot.on .full { animation: none; opacity: 1; filter: drop-shadow(0 0 12px #ffe27a); }
  .sweep, .sparkle, .stars.perfect .slot.mid::before { animation: none; }
  .slot.on .empty { fill: #ffc93c55; }
}
</style>

<!-- Welcome -->
<div id="welcome" class="screen">
  <div class="floaters" id="floaters"></div>
  <div class="wtop"><span class="coins"><i class="coin"></i><span class="coinNum">0</span></span></div>
  <div class="brand">
    <h1 id="logo">ColorShred</h1>
    <p>Slide every block into its matching shredder.</p>

  if (k === 'thaw') { W.blocks[i].ice = 0; rebuildCtx(); redrawBlock(i); sfx('magic'); updateHud(); saveCurrent(); return; }
  if (k === 'blast') {
    busy = true; const el = els[i], a = pos[i], si = CS.shapeInfo[ctx.blocks[i].sh];
    spawnShreds(gt + (a % W.w) * cs, gt + Math.floor(a / W.w) * cs, si.w * cs, si.h * cs, 'X', COLORS[ctx.blocks[i].c], 26);
    el.classList.add('blasting'); el.style.transform += ' scale(.2)';
    pos[i] = -1; els[i] = null; sfx('blast'); updateHud();
    setTimeout(() => { el.remove(); busy = false; updateHud(); saveCurrent(); checkEnd(); }, 270);
  }
}

// ---------- end of board ----------
function checkEnd() {
  if (over) return;
  if (!pos.some(p => p >= 0)) return mode === 'unstoppable' ? unstoppableClear() : win();
  if (mode === 'campaign' && moves >= W.moves + extraMoves) lose('Out of moves', 'Every drag counts as one move. Try a tighter route.');
}
function win() {
  over = true; clearHint();
  const id = W.id, first = !S.stars[id], extra = moves - W.opt;
  const s = extra <= 0 ? 3 : extra <= ({ easy: 3, medium: 2 }[W.tier] || 1) ? 2 : 1;
  const prev = S.stars[id] || 0;
  const coins = first ? TIER[W.tier].reward + s * 5 : Math.max(0, s - prev) * 5;
  S.stars[id] = Math.max(prev, s); S.current = null;
  setCoins(S.coins + coins, coins > 0); save();
  const p = prize(li), next = li + 1 < LEVELS.length ? li + 1 : -1;
  const finished = first && allDone();
  const STAR = '<path d="M50 4l13.5 28.6 31.3 3.9-23 21.6 6 31L50 74 22.2 89.1l6-31-23-21.6 31.3-3.9z"/>';
  const perfect = s === 3, shineAt = 0.25 + 2 * 0.38 + 0.6; // the shine starts once the third star has landed
  const sweep = k => perfect ? `<defs><clipPath id="sclip${k}">${STAR}</clipPath><linearGradient id="sgrad${k}" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <g clip-path="url(#sclip${k})"><rect class="sweep" style="--sw:${(shineAt + (k - 1) * 0.18).toFixed(2)}s" x="0" y="-20" width="34" height="140" fill="url(#sgrad${k})" transform="skewX(-20)"/></g>` : '';
  const starsHtml = [1, 2, 3].map(k => `<div class="slot${k === 2 ? ' mid' : ''}${k <= s ? ' on' : ''}" style="--d:${0.25 + (k - 1) * 0.38}s">
    <svg viewBox="0 0 100 100"><g class="empty">${STAR}</g><g class="full">${STAR}</g>${sweep(k)}</svg></div>`).join('')
    + (perfect ? [[4, 10], [30, -8], [62, 4], [92, 14], [14, 78], [80, 80]].map(([x, y], n) =>
      `<svg class="sparkle" viewBox="0 0 20 20" style="left:${x}%;top:${y}%;--tw:${(shineAt + n * 0.27).toFixed(2)}s"><path d="M10 0c.8 5.6 4.4 9.2 10 10-5.6.8-9.2 4.4-10 10-.8-5.6-4.4-9.2-10-10 5.6-.8 9.2-4.4 10-10z"/></svg>`).join('') : '');
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const brag = () => {
    if (!noPU) return pick([`Solved in ${moves} moves with a little help. Smart use of power-ups!`, `Done in ${moves} moves. Knowing when to use a power-up is a skill too!`]);
    if (extra <= 0) return pick([`Genius! ${moves} moves, a perfect solve.`, `Flawless! Not a single wasted move in ${moves}.`, `Big brain! ${moves} moves matches the best possible.`]);
    const more = `${extra} more than a perfect solve`;
    if (extra <= 2) return pick([`So close! Solved in ${moves} moves, just ${more}!`, `Sharp thinking! ${moves} moves, only ${more}.`]);
    if (extra <= 5) return pick([`Nice work! Solved in ${moves} moves. A perfect solve takes ${W.opt}.`, `Shredded in ${moves} moves! You're getting closer to perfect (${W.opt}).`]);
    return pick([`You did it in ${moves} moves! Every level makes you sharper.`, `Solved in ${moves} moves! A perfect solve takes ${W.opt}. Can you find it?`]);
  };
  const retry = s < 3 && !finished; // fewer than 3 stars: offer a retry, but moving on is always the main choice
  const noPU = !Object.keys(used).length;
  showCard(`<div class="stars${perfect ? ' perfect' : ''}" aria-label="${s} of 3 stars">${starsHtml}</div>
    <h3>${finished ? 'All levels done!' : s === 3 ? 'Perfect!' : 'Shredded!'}</h3>
    <p>${finished ? `You beat all ${LEVELS.length} levels. Unstoppable mode never ends.` : brag()}</p>
    ${coins ? `<div class="reward"><i class="coin"></i>+${coins}</div>` : ''}
    ${first ? `<div class="unlock"><i style="background:${p.css}"></i><div>New color unlocked<b>${p.name}</b></div><button id="equipBtn">${S.equipped === li ? 'Equipped' : 'Use it'}</button></div>` : ''}
    ${finished ? `<button class="btn" id="goUnst">Play Unstoppable</button>` : ''}
    ${!finished && next >= 0 ? `<button class="btn" id="nextBtn">Next level</button>` : ''}
    ${retry ? `<button class="btn alt" id="replayBtn">Retry for 3 stars</button><p class="goal">Optional: 3 stars needs ${W.opt} moves or fewer${noPU ? '' : ', without power-ups'}.</p>`
            : '<button class="btn alt" id="replayBtn">Replay</button>'}<button class="btn alt" id="menuBtn">Menu</button>`);
  for (let k = 1; k <= s; k++) setTimeout(() => sfx('star' + k), (0.25 + (k - 1) * 0.38 + 0.42) * 1000);
  if ($('equipBtn')) $('equipBtn').onclick = () => { S.equipped = li; save(); applyTheme(); $('equipBtn').textContent = 'Equipped'; };
  if ($('nextBtn')) $('nextBtn').onclick = () => startCampaign(next, false);
  if ($('goUnst')) $('goUnst').onclick = startUnstoppable;
  $('replayBtn').onclick = () => startCampaign(li, false); $('menuBtn').onclick = renderWelcome;
}
function lose(title, msg) {
  over = true; sfx('fail'); clearHint(); S.current = null; save();
  const outOfTime = title === "Time's up", canBuy = (used.extra || 0) < PU.extra.limit && S.coins >= PU.extra.cost;
  showCard(`<h3>${title}</h3><p>${msg}</p>
    ${canBuy ? `<button class="btn" id="buyMore"><span style="display:inline-flex;align-items:center;gap:8px">${outOfTime ? '+20 seconds' : '+5 moves'} for <i class="coin"></i>${PU.extra.cost}</span></button>` : ''}
    <button class="btn ${canBuy ? 'alt' : ''}" id="retryBtn">Try again</button><button class="btn alt" id="menuBtn">Menu</button>`);
  $('retryBtn').onclick = () => startCampaign(li, false); $('menuBtn').onclick = renderWelcome;
  if (canBuy) $('buyMore').onclick = () => { over = false; hideOverlay(); spend('extra'); if (outOfTime) timeLeft += 20; else extraMoves += 5; sfx('magic'); updateHud(); saveCurrent(); };
}

// ---------- Unstoppable ----------
let worker = null, pending = {};
function getWorker() {
  if (worker !== null) return worker;
  try {
    const src = $('src-engine').textContent + '\n' + $('src-gen').textContent + `
self.onmessage = e => { const { stage, seed } = e.data;
  for (let k = 0; k < 8; k++) { CSGen.setSeed(seed + k * 7919); const T = CSGen.unstoppableTier(stage); const r = CSGen.generate(T, { cap: 4000 });
    if (r.lvl) { postMessage({ stage, lvl: r.lvl, relocs: r.relocs }); return; } }
  postMessage({ stage, error: true }); };`;
    worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
    worker.onmessage = e => { const cb = pending[e.data.stage]; delete pending[e.data.stage]; if (cb) cb(e.data); };
    worker.onerror = () => { worker = false; };
  } catch (e) { worker = false; }
  return worker;
}
function requestBoard(stage, cb) {
  const seed = (Date.now() ^ (stage * 2654435761)) | 0;
  const w = getWorker();
  if (w) { pending[stage] = cb; w.postMessage({ stage, seed }); return; }
  setTimeout(() => { // fallback: generate on the main thread
    let r = { lvl: null };
    for (let k = 0; k < 8 && !r.lvl; k++) { CSGen.setSeed(seed + k * 7919); r = CSGen.generate(CSGen.unstoppableTier(stage), { cap: 4000 }); }
    cb(r.lvl ? { stage, lvl: r.lvl, relocs: r.relocs } : { stage, error: true });
  }, 30);
}
function prefetch(stage) {
  U.next = null; const run = U;
  requestBoard(stage, res => {
    if (U !== run) return;
    if (res.error) return prefetch(stage);
    U.next = res;
    if (U.waiting) { U.waiting = false; loadUnstoppableBoard(); }
  });
}
function startUnstoppable() {
  mode = 'unstoppable'; U = { stage: 1, cleared: 0, earned: 0, next: null, waiting: true };
  timeLeft = 90; over = false; busy = false; armed = null; hist = [];
  show('play');
  $('lvName').textContent = 'Stage 1'; $('lvTier').textContent = 'Unstoppable'; $('play').style.setProperty('--tc', TIER.unstoppable.color);
  $('movesLabel').textContent = 'Cleared';
  W = null; showGenerating();
  prefetch(1);
}
function showGenerating() {
  $('stage').innerHTML = '<div class="gen"><div><div class="spinner"></div>Building the next board…</div></div>';
  $('powers').innerHTML = '';
}
function loadUnstoppableBoard() {
  const res = U.next; U.next = null;
  W = res.lvl; W.__orig = clone(W.blocks); W.tier = 'unstoppable'; W.opt = W.blocks.length + res.relocs;
  ctx = null; rebuildCtx();
  pos = ctx.blocks.map(b => b.y * W.w + b.x); moves = 0; extraMoves = 0; hist = []; used = {}; over = false; busy = false; armed = null;
  $('lvName').textContent = 'Stage ' + U.stage;
  buildBoard(); updateHud();
  if (U.stage > 1) flash('Stage ' + U.stage);
  prefetch(U.stage + 1);
}
function unstoppableClear() {
  // Time bonus: 10 seconds, plus more for harder boards (extra moves the board needed, and its size), up to 30 seconds.
  const relocs = W.opt - W.blocks.length;
  const bonus = 10 + Math.min(20, relocs * 2 + Math.floor(Math.max(0, W.blocks.length - 10) / 3));
  const coins = 5 + Math.floor(U.stage / 2);
  U.cleared++; U.earned += coins; timeLeft += bonus;
  setCoins(S.coins + coins, true); sfx('coin');
  flash(`+${bonus}s`);
  U.stage++;
  if (U.stage - 1 > S.best) { S.best = U.stage - 1; save(); }
  busy = true;
  setTimeout(() => {
    busy = false;
    if (U.next) loadUnstoppableBoard(); else { U.waiting = true; showGenerating(); }
  }, 650);
}
function endRun(quit) {
  over = true; sfx('fail');
  const reached = U.stage, best = Math.max(S.best, U.cleared);
  S.best = best; S.bestCleared = Math.max(S.bestCleared || 0, U.cleared); save();
  showCard(`<h3>${quit ? 'Run over' : "Time's up"}</h3><p>You cleared ${U.cleared} board${U.cleared === 1 ? '' : 's'} and reached stage ${reached}.<br>Best run: ${best} boards.</p>
    ${U.earned ? `<div class="reward"><i class="coin"></i>+${U.earned}</div>` : ''}
    <button class="btn" id="againBtn">Run again</button><button class="btn alt" id="menuBtn">Menu</button>`);
  $('againBtn').onclick = startUnstoppable; $('menuBtn').onclick = () => { U = null; renderWelcome(); };
}
function flash(text) {
  const f = document.createElement('div'); f.className = 'flash'; f.textContent = text; $('play').appendChild(f);
  setTimeout(() => f.remove(), 1200);
}

// ---------- controls ----------
function undo() {
  if (!hist.length || busy || drag || over) return;
  clearHint(); armed = null;
  const h = hist.pop(), wasRemoved = pos[h.i] < 0;
  pos = h.pos; moves = h.moves;
  if (wasRemoved) redrawBlock(h.i); else place(h.i);
  updateHud(); saveCurrent();
}
function restart() {
  if (busy || drag) return;
  if (mode === 'campaign') { S.current = null; startCampaign(li, false); return; }
  // Unstoppable: reset this board; the clock keeps running
  W.blocks = clone(W.__orig); rebuildCtx();
  pos = ctx.blocks.map(b => b.y * W.w + b.x); moves = 0; hist = []; armed = null; clearHint();
  buildBoard(); updateHud();
}
function clearHint() { hintEls.forEach(e => e.classList.contains('ghost') ? e.remove() : e.classList.remove('hint')); hintEls = []; }
function hint() {
  if (over || busy || drag || !W) return;
  clearHint();
  const occ = CS.occupancy(ctx, pos);
  for (let i = 0; i < pos.length; i++) {
    if (pos[i] < 0 || CS.frozen(ctx, pos, i)) continue;
    const a = CS.reachable(ctx, occ, pos, i).find(a => CS.canExitFrom(ctx, i, a, occ));
    if (a != null) return showHint(i, a, 'Drag the glowing block into its gate.');
  }
  const res = CS.solve(W, pos, 40000);
  if (!res) return toast('This one is too tangled for a hint right now. Try Undo.');
  if (res.unsolvable) return toast('No way out from here. Undo, restart or use a power-up.');
  const st = res.plan[0];
  showHint(st.i, st.to, `Move the glowing block to the outlined spot. Best finish from here: ${res.relocs + pos.filter(p => p >= 0).length} moves.`);
}
function showHint(i, a, msg) {
  els[i].classList.add('hint'); hintEls.push(els[i]);
  if (a !== pos[i]) {
    const g = makeShape(ctx.blocks[i], true);
    g.style.transform = `translate(${(a % W.w) * cs}px, ${Math.floor(a / W.w) * cs}px)`;
    ctx.field.appendChild(g); hintEls.push(g);
  }
  toast(msg);
}
let toastT = null;
function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; $('play').appendChild(t); }
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastT); toastT = setTimeout(() => { t.style.opacity = 0; }, 2600);
}

// ---------- overlays ----------
function showCard(html) { $('card').innerHTML = html; $('overlay').hidden = false; }
function hideOverlay() { $('overlay').hidden = true; }
function showRules() {
  showCard(`<h3>How to play</h3><div class="rules">
    <div><b>1</b><span>Drag a block. It slides around other blocks and stops at walls.</span></div>
    <div><b>2</b><span>Push it into a gate of the same color and symbol to shred it. It must fit the gate, and nothing can be in its way.</span></div>
    <div><b>3</b><span>Arrow blocks only slide along their arrows. Ice blocks thaw after you shred the number of blocks shown.</span></div>
    <div><b>4</b><span>Every drag uses one move. Power-ups cost coins and are limited on each level.</span></div>
    <div><b>5</b><span>Beat a level to unlock the next one, earn coins and win a new board color.</span></div>
  </div><button class="btn" id="okBtn">Got it</button>`);
  $('okBtn').onclick = hideOverlay;
}
function showSettings() {
  const code = btoa(unescape(encodeURIComponent(JSON.stringify({ ...S, current: S.current }))));
  showCard(`<h3>Settings</h3>
    <button class="btn alt" id="sndBtn">Sound: ${S.sound ? 'on' : 'off'}</button>
    <button class="btn alt" id="rulesBtn">How to play</button>
    <p style="margin:16px 0 6px">Your progress saves on this phone automatically. Copy this backup code somewhere safe to restore it later.</p>
    <textarea id="saveCode" readonly>${code}</textarea>
    <div class="row2"><button class="btn alt" id="copyBtn">Copy code</button><button class="btn alt" id="loadBtn">Load code</button></div>
    <button class="btn danger" id="resetBtn">Reset all progress</button>
    <button class="btn" id="closeBtn">Done</button>`);
  $('sndBtn').onclick = () => { S.sound = !S.sound; save(); $('sndBtn').textContent = 'Sound: ' + (S.sound ? 'on' : 'off'); };
  $('rulesBtn').onclick = showRules;
  $('closeBtn').onclick = () => { hideOverlay(); renderWelcome(); };
  $('copyBtn').onclick = () => {
    const ta = $('saveCode');
    const done = () => { $('copyBtn').textContent = 'Copied'; };
    try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); }); } catch (e) { ta.select(); }
  };
  $('loadBtn').onclick = () => {
    const ta = $('saveCode');
    if (ta.readOnly) { ta.readOnly = false; ta.value = ''; ta.placeholder = 'Paste a backup code, then tap Load code again'; ta.focus(); return; }
    try {
      const data = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim()))));
      if (!data || data.v !== 2) throw 0;
      S = Object.assign(freshSave(), data); save(); applyTheme(); setCoins(S.coins);
      showCard(`<h3>Loaded</h3><p>Your progress is restored.</p><button class="btn" id="okBtn">OK</button>`); $('okBtn').onclick = renderWelcome;
    } catch (e) { ta.value = ''; ta.placeholder = "That code didn't work. Check you pasted all of it."; }
  };
  $('resetBtn').onclick = () => {
    if ($('resetBtn').dataset.sure) { const snd = S.sound; S = freshSave(); S.sound = snd; save(); applyTheme(); hideOverlay(); renderWelcome(); return; }
    $('resetBtn').dataset.sure = 1; $('resetBtn').textContent = 'Tap again to erase everything';
  };
}
function goBack() {
  if (mode === 'unstoppable' && U && !over) {
    showCard(`<h3>Paused</h3><p>Stage ${U.stage} · ${U.cleared} cleared. The clock is stopped.</p>
      <button class="btn" id="resumeBtn">Resume</button><button class="btn alt" id="quitBtn">End run</button>`);
    $('resumeBtn').onclick = hideOverlay; $('quitBtn').onclick = () => { hideOverlay(); endRun(true); };
    return;
  }
  saveCurrent(); clearHint(); armed = null; renderWelcome();
}

// ---------- wiring ----------
$('playBtn').onclick = () => {
  const cur = S.current && idx[S.current.id];
  if (cur != null) return startCampaign(cur, true);
  const n = nextLevel();
  if (n < 0) return renderLevels();
  startCampaign(n, false);
};
$('unstBtn').onclick = startUnstoppable;
$('levelsBtn').onclick = renderLevels;
$('colorsBtn').onclick = renderColors;
$('settingsBtn').onclick = showSettings;
document.querySelectorAll('.backHome').forEach(b => b.onclick = renderWelcome);
$('backBtn').onclick = goBack;
$('undoBtn').onclick = undo;
$('restartBtn').onclick = restart;
$('hintBtn').onclick = hint;
let rT = null;
window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { if (!$('play').hidden && W && ctx && ctx.field) { clearHint(); buildBoard(); updateHud(); } }, 120); });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveCurrent(); });
applyTheme();
renderWelcome();
// Ask the phone to keep this game's saved data instead of clearing it when storage runs low
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
// Tip for Safari users who opened the web address but haven't installed it yet
try {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios && navigator.standalone === false && window.top === window && !lsGet('colorshred:hideInstall')) $('installTip').hidden = false;
} catch (e) {}
$('installClose').onclick = () => { $('installTip').hidden = true; lsSet('colorshred:hideInstall', '1'); };
window.__game = { pos: () => pos, ctx: () => ctx, level: () => W, cs: () => cs, moves: () => moves, start: startCampaign, unst: startUnstoppable, run: () => U, save: () => S };
})();
</script>
